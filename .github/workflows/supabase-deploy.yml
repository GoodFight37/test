name: Mise à jour Supabase

on:
  workflow_run:
    workflows: ["Vérification"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Vérifier la connexion et l’historique uniquement, sans appliquer de migration"
        type: boolean
        default: true
      approve_manual:
        description: "Appliquer aussi les migrations explicitement classées manual (après revue)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: creatordeck-supabase-production
  cancel-in-progress: false

jobs:
  migrations:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Vérifier la CI et la révision courante de main
        id: revision
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const current = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const sha = context.eventName === 'workflow_run' ? context.payload.workflow_run.head_sha : context.sha;
            if (sha !== current.data.commit.sha) {
              core.notice('Une nouvelle révision est arrivée : attendre sa CI.');
              core.setOutput('ready', 'false');
              return;
            }
            const runs = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'verification.yml', head_sha: sha, per_page: 100 });
            const trusted = runs.data.workflow_runs.find(r => r.head_repository.full_name === `${owner}/${repo}` && r.head_branch === 'main' && ['push', 'workflow_dispatch'].includes(r.event) && r.status === 'completed' && r.conclusion === 'success');
            const readOnly = context.eventName === 'workflow_dispatch' && context.payload.inputs?.dry_run === 'true';
            if (!trusted && !readOnly) throw new Error('La vérification complète de cette révision doit réussir avant les migrations.');
            if (readOnly) core.notice('Diagnostic en lecture seule : aucune migration, sans attendre la CI complète.');
            core.setOutput('sha', sha);
            core.setOutput('ready', 'true');
      - uses: actions/checkout@v4
        if: steps.revision.outputs.ready == 'true'
        with:
          ref: ${{ steps.revision.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.revision.outputs.ready == 'true'
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        if: steps.revision.outputs.ready == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        with:
          version: 2.39.2
      - name: Installer le pilote PostgreSQL isolé
        if: steps.revision.outputs.ready == 'true'
        run: |
          npm install --prefix /tmp/creatordeck-deploy --no-save pg@8.16.3
          mkdir -p node_modules
          ln -s /tmp/creatordeck-deploy/node_modules/pg node_modules/pg
      - name: Contrôler le projet et appliquer les nouvelles migrations
        if: steps.revision.outputs.ready == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          APPROVE_MANUAL: ${{ github.event_name == 'workflow_dispatch' && inputs.approve_manual }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/supabase-deploy.mjs --dry-run
          elif [ "$APPROVE_MANUAL" = "true" ]; then
            node scripts/supabase-deploy.mjs --approve-manual
          else
            node scripts/supabase-deploy.mjs
          fi
